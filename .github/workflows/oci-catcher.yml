name: OCI ARM Catcher

on:
  schedule:
    # 每 10 分钟自动运行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许在网页端随时手动点一下运行

jobs:
  catch-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & OCI CLI
        run: |
          pip install oci-cli

      - name: Inject OCI Credentials from Secrets
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          
          # 写入 OCI CLI 配置文件
          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=ap-seoul-1
          key_file=/home/runner/.oci/oci_api_key.pem
          EOF
          
          # 修复配置文件权限，消除权限警告
          chmod 600 ~/.oci/config

      - name: Run OCI Instance Creation Script
        run: |
          oci compute instance launch \
            --compartment-id "${{ secrets.COMPARTMENT_ID }}" \
            --availability-domain "tbMy:AP-SEOUL-1-AD-1" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
            --image-id "ocid1.image.oc1.ap-seoul-1.aaaaaaaa4p37ikdvvzojugnmzwa3qbah7z74fnlfxf2vjkd7hcur63btf7lq" \
            --subnet-id "ocid1.subnet.oc1.ap-seoul-1.aaaaaaaabjkvwuslto7cnhtrj5meb44hdehq227tlqb3bi2lg2qnqxxwkxra" \
            --assign-public-ip true \
            --assign-ipv6-ip true \
            --display-name "instance-20261014-2354" \
            --boot-volume-size-in-gbs 100 \
            --ssh-authorized-keys-file <(echo "${{ secrets.SSH_PUBLIC_KEY }}") || true
